name: Deploy to SiteGround production

# SiteGround's GrowBig plan does not include the native "Git Version
# Control" tool in Site Tools (that's GoGeek-only), so this deploys via
# SSH + rsync instead of the Site Tools Git integration the original
# spec assumed. See README's "Production deploy (SiteGround, GrowBig)"
# section for the one-time setup this depends on.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}

      - name: Add SiteGround host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SITEGROUND_SSH_PORT }}" "${{ secrets.SITEGROUND_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy landers
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.SITEGROUND_SSH_PORT }}" \
            landers/ \
            "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:${{ secrets.SITEGROUND_LANDERS_PATH }}/"

      - name: Deploy mu-plugins
        run: |
          rsync -avz -e "ssh -p ${{ secrets.SITEGROUND_SSH_PORT }}" \
            wp-content/mu-plugins/ \
            "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:${{ secrets.SITEGROUND_MUPLUGINS_PATH }}/"
