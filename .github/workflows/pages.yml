name: Deploy staging preview to GitHub Pages

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static previews from each lander's template.php
        run: |
          set -e
          # find (not a landers/*/template.php glob) so nested step pages,
          # e.g. landers/{name}/step-2/template.php, are picked up too.
          find landers -type f -name template.php | while read -r f; do
            dir=$(dirname "$f")
            rel=${dir#landers/}
            # Strip the leading Template Name PHP header (WordPress-only
            # syntax GitHub Pages can't execute) so the rest renders as
            # plain HTML.
            sed '0,/?>/d' "$f" > "$dir/index.html"
            # Rewrite absolute /wp-content/uploads/... asset paths (correct
            # once WordPress serves the file from its own domain root) to
            # relative paths that resolve under the Pages project subpath.
            # template.php itself is untouched.
            sed -i "s#/wp-content/uploads/landers/${rel}/assets/#assets/#g" "$dir/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
